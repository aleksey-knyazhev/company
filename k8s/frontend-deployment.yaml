apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: company-frontend
  template:
    metadata:
      labels:
        app: company-frontend
    spec:
      containers:
        - name: company-frontend
          image: company-frontend:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
