datasources.default.url=jdbc:tc:postgresql:16:///db_name
datasources.default.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
datasources.default.dialect=POSTGRES

jpa.default.entity-scan.packages=ru.company.domain
jpa.default.properties.hibernate.hbm2ddl.auto=create-drop
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jpa.default.properties.hibernate.show_sql=true