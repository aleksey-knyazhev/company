datasources.default.url=jdbc:tc:postgresql:16-alpine:///company_test
datasources.default.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
datasources.default.username=company
datasources.default.password=company
datasources.default.dialect=POSTGRES
datasources.default.connection-init-sql=CREATE SCHEMA IF NOT EXISTS company

liquibase.datasources.default.default-schema=company
liquibase.datasources.default.liquibase-schema=company

jpa.default.entity-scan.packages=ru.company.domain
jpa.default.properties.hibernate.hbm2ddl.auto=validate
jpa.default.properties.hibernate.default_schema=company
jpa.default.properties.hibernate.show_sql=true
