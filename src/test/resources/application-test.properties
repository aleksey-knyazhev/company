datasources.default.url=jdbc:h2:mem:company-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
datasources.default.driver-class-name=org.h2.Driver
datasources.default.dialect=H2

jpa.default.entity-scan.packages=ru.company.domain
jpa.default.properties.hibernate.hbm2ddl.auto=create-drop
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jpa.default.properties.hibernate.show_sql=true
jpa.default.reactive=false
