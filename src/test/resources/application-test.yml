datasources:
  default:
    url: jdbc:tc:postgresql:16:///db_name
    driverClassName: org.testcontainers.jdbc.ContainerDatabaseDriver
    #dialect: POSTGRES
    #db-type: postgres

jpa:
  default:
    #datasource: default
    entity-scan:
      packages: 'ru.company.domain'
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
    reactive: false